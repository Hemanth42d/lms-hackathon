name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "Frontend/**"
      - "vercel.json"
  pull_request:
    branches:
      - main
    paths:
      - "Frontend/**"
      - "vercel.json"

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Frontend/lms/package-lock.json

      - name: Install dependencies
        run: |
          cd Frontend/lms
          npm ci

      - name: Build project
        run: |
          cd Frontend/lms
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
